<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">

<nav aria-label="Display control bar" style="display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: #000; border-bottom: 1px solid #3A3A3A">
<sc-for list="{{dcb}}" as="b" hint-placeholder-count="14">
<button type="button" style="font: inherit; font-size: 11px; line-height: 1.15; min-width: 64px; height: 44px; padding: 0 6px; border: 1px solid #4A4A4A; background: {{b.bg}}; color: #E0E0E0; cursor: pointer; white-space: pre-line; text-align: center">{{b.label}}</button>

</nav>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var labels = ['RANGE\n40', 'PLACE\nCNTR', 'OFF\nCNTR', 'RR\n5', 'PLACE\nRR', 'RR\nCNTR', 'MAPS', 'BRITE', 'LDR DIR\nNE', 'LDR\n2', 'CHAR\nSIZE', 'MODE\nFSL', 'SITE\nEHAM', 'PREF', 'SSA\nFILTER', 'SHIFT'];
    return {
      dcb: labels.map(function (l, i) {
        return { label: l, bg: (i === 0 || i === 3 || i === 9) ? '#004A00' : '#1A1A1A' };
      })
    };
  }
}
</script>
</body>
</html>
