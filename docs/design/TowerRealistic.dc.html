<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tower, realistic display</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#E0E0E0}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 100%; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #000; color: #E0E0E0; font-family: 'JetBrains Mono', monospace; font-size: 12px">

<nav aria-label="Display control bar" style="display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: #000; border-bottom: 1px solid #3A3A3A">
<sc-for list="{{dcb}}" as="b" hint-placeholder-count="12">
<button type="button" style="font: inherit; font-size: 11px; line-height: 1.15; min-width: 64px; height: 44px; padding: 0 6px; border: 1px solid #4A4A4A; background: {{b.bg}}; color: #E0E0E0; cursor: pointer; white-space: pre-line; text-align: center">{{b.label}}</button>
</sc-for>
</nav>

<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap">
<div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; min-height: 0">

<main style="position: relative; width: 100%; aspect-ratio: 28 / 15; max-height: 560px; overflow: hidden; background: #000">
<img src="/_blob/aea3317785af16fc01424e5154307f35" alt="Out-the-window view from Tower West over runway 18R, without labels" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 33%; width: 8px; background: #000"></div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 67%; width: 8px; background: #000"></div>
<div aria-hidden="true" style="position: absolute; left: 46.4%; top: 46.1%; width: 26px; height: 18px; margin-left: -13px; margin-top: -9px; border: 1px solid #FFFFFF"></div>
<div style="position: absolute; left: 12px; top: 10px; display: flex; flex-direction: column; gap: 2px; color: #3FD13F; font-size: 12px; line-height: 1.35; text-shadow: 0 0 3px #000">
<span>TWR W  340°</span>
<span>LBL OFF  SEL EZY81QK</span>
</div>
</main>

<section aria-label="Electronic strip board" style="flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: #111; border-top: 1px solid #3A3A3A; overflow: auto">
<sc-for list="{{bays}}" as="bay" hint-placeholder-count="3">
<div style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 4px; background: #1A1A1A; border: 1px solid #3A3A3A">
<div style="font-size: 11px; color: #A0A0A0; padding: 2px 4px">{{bay.name}}</div>
<sc-for list="{{bay.strips}}" as="s" hint-placeholder-count="2">
<button type="button" style="font: inherit; text-align: left; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 8px; padding: 4px 6px; border: 1px solid #000; border-left: 6px solid {{s.edge}}; background: {{s.bg}}; color: #111; cursor: pointer">
<span style="font-weight: 700">{{s.cs}}</span><span>{{s.type}}</span><span style="text-align: right">{{s.rwy}}</span>
<span>{{s.a}}</span><span>{{s.b}}</span><span style="text-align: right; font-weight: 700">{{s.clr}}</span>
</button>
</sc-for>
</div>
</sc-for>
</section>
</div>

<aside aria-label="Ground radar" style="flex: 1 1 300px; max-width: 360px; border-left: 1px solid #3A3A3A; background: #000; display: flex; flex-direction: column; min-height: 0">
<div style="padding: 6px 10px; color: #3FD13F; border-bottom: 1px solid #3A3A3A">GND RADAR  EHAM  RNG 6</div>
<svg viewBox="40 0 190 190" role="img" aria-label="Ground radar: runway 18R with EZY81QK rolling out and KLM66P on final, runway 24 with TRA5422 lined up and EZY45MP at the holding point" style="width: 100%; flex: 1 1 auto; min-height: 0">
<g stroke="#3A3A3A" stroke-width="3.6" stroke-linecap="square">
<line x1="78.6" y1="28.8" x2="74.4" y2="84.7"></line>
<line x1="113.4" y1="167.1" x2="171.7" y2="130.6"></line>
<line x1="127.5" y1="105.8" x2="196.5" y2="101.9"></line>
<line x1="117.1" y1="73" x2="113.5" y2="138.9"></line>
<line x1="171.1" y1="107" x2="167.3" y2="174.9"></line>
<line x1="176.3" y1="142.1" x2="202.9" y2="111.7"></line>
</g>
<g stroke="#5A4A10" stroke-width="1" fill="none">
<path d="M86 30 L82 86 M178 128 L120 164 M160 120 L170 128"></path>
</g>
<g font-size="6.5" fill="#6A6A6A"><text x="82" y="26">18R</text><text x="176" y="128">24</text></g>
<g font-size="7">
<rect x="73.5" y="63.8" width="5" height="5" fill="#FFFFFF"></rect>
<text x="50" y="62" fill="#FFFFFF">EZY81QK</text>
<rect x="165.2" y="129.7" width="5" height="5" fill="#3FD13F"></rect>
<text x="174" y="143" fill="#3FD13F">TRA5422</text>
<rect x="160" y="122" width="5" height="5" fill="#3FD13F"></rect>
<text x="150" y="117" fill="#3FD13F">EZY45MP</text>
<path d="M80 12 L80 4 M77 7 L80 4 L83 7" stroke="#3FD13F" stroke-width="1.2" fill="none"></path>
<text x="85" y="11" fill="#3FD13F">KLM66P 2.0</text>
</g>
</svg>
<div style="padding: 8px 10px; border-top: 1px solid #3A3A3A; display: flex; flex-direction: column; gap: 3px; font-size: 13px; line-height: 1.35">
<span style="color: #3FD13F">RDBK OK KLM66P CLR LAND 18R</span>
<span style="color: #3FD13F">PHR EZY81QK VACATE → LEFT VIA E5</span>
<span style="color: #E0E0E0">EZY81QK CTC GND 121.800<span style="color: #FFFFFF">▍</span></span>
<span style="color: #6A6A6A; font-size: 11px">VOICE 94% · PTT SPACE · 118.280</span>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var labels = ['CAB\nWEST', 'CAB\nCNTR', 'BINO\nB', 'LOOK\n340', 'LBL\nOFF', 'RWY LT\n30%', 'BRITE', 'VIS\n10KM', 'PAUSE', 'RATE\n1X', 'DISP\nMODERN', 'PREF', 'END'];
    var on = { 0: 1, 4: 1 };
    var arr = { bg: '#F2E6B8', edge: '#C9A227' };
    var dep = { bg: '#C8DCF0', edge: '#2F6FB0' };
    return {
      dcb: labels.map(function (l, i) {
        return { label: l, bg: on[i] ? '#004A00' : '#1A1A1A' };
      }),
      bays: [
        { name: 'ARR 18R', strips: [
          Object.assign({ cs: 'TRA6015', type: 'B738/M', rwy: '18R', a: 'APP', b: '7.5NM', clr: '' }, arr),
          Object.assign({ cs: 'KLM66P', type: 'A332/H', rwy: '18R', a: 'TWR', b: '2.0NM', clr: 'LAND' }, arr)
        ] },
        { name: 'RWY', strips: [
          Object.assign({ cs: 'EZY81QK', type: 'A320/M', rwy: '18R', a: 'VAC', b: 'E5', clr: 'GND' }, arr),
          Object.assign({ cs: 'TRA5422', type: 'B738/M', rwy: '24', a: 'LUW', b: '', clr: '' }, dep)
        ] },
        { name: 'DEP 24', strips: [
          Object.assign({ cs: 'EZY45MP', type: 'A320/M', rwy: '24', a: 'S1', b: 'RDY', clr: '' }, dep)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
